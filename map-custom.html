<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#22022f">
  <title>Mapa HSMC | Seguimiento GPS</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--p:#22022f;--p2:#4b0b63;--g:#d4a53b;--g2:#f0cf72;--ok:#2eaf5d;--muted:#75697a}
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;background:#f5eff7;color:#211629}
    body{display:grid;grid-template-rows:auto 1fr auto}
    header{background:linear-gradient(135deg,#1b0226,#4a0b63);color:#fff;border-bottom:3px solid var(--g);padding:12px 16px;display:flex;align-items:center;gap:12px}
    .seal{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--g2),var(--g));color:var(--p);font-size:24px;font-weight:900}
    .brand span{display:block;font-size:9px;letter-spacing:.15em;color:var(--g2)}.brand strong{display:block;font-family:Georgia,serif;font-size:15px}
    .status{margin-left:auto;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:800;white-space:nowrap}
    main{position:relative;min-height:0}.map{width:100%;height:100%}
    .panel{position:absolute;z-index:500;left:14px;right:14px;top:14px;max-width:520px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid #e7d9e9;border-radius:16px;padding:13px 14px;box-shadow:0 12px 28px rgba(46,6,63,.15)}
    .panel small{display:block;color:var(--g);font-weight:900;letter-spacing:.12em}.panel h1{font-family:Georgia,serif;color:var(--p);font-size:20px;margin:4px 0}.panel p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
    .gpsrow{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:11px}.dot{width:9px;height:9px;border-radius:50%;background:#a7a0aa}.dot.ok{background:var(--ok);box-shadow:0 0 0 5px rgba(46,175,93,.13)}
    .anda-marker{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f0cf72,#d4a53b);border:4px solid #fff;box-shadow:0 5px 18px rgba(34,2,47,.38);color:#22022f;font-size:30px;font-weight:900}
    .anda-pulse{position:absolute;width:72px;height:72px;border-radius:50%;background:rgba(88,18,119,.18);animation:pulse 1.8s infinite}
    @keyframes pulse{0%{transform:scale(.75);opacity:.9}100%{transform:scale(1.35);opacity:0}}
    footer{background:#190122;color:#fff;border-top:2px solid var(--g);padding:10px 14px;text-align:center;font-size:10px;letter-spacing:.08em}
    @media(max-width:640px){header{padding:10px 12px}.brand strong{font-size:12px}.status{font-size:0}.status:after{content:"GPS";font-size:11px}.panel{top:10px;left:10px;right:10px}.panel h1{font-size:17px}}
  </style>
</head>
<body>
<header>
  <div class="seal">✝</div>
  <div class="brand"><span>HERMANDAD DEL</span><strong>SEÑOR DE LOS MILAGROS DE COMAS · KM 13</strong></div>
  <div class="status" id="headerStatus">Preparando GPS</div>
</header>

<main>
  <div id="map" class="map"></div>
  <section class="panel">
    <small>MAPA HSMC · SIN MARCADOR DE VEHÍCULO</small>
    <h1>Sagradas Andas</h1>
    <p id="message">Esperando la conexión segura con el GPS para mostrar la ubicación real.</p>
    <div class="gpsrow"><span class="dot" id="dot"></span><strong id="gpsStatus">GPS pendiente</strong><span id="gpsTime"></span></div>
  </section>
</main>

<footer>HSMC · KM 13 · “Patrón de Lima Norte” · mapa propio en preparación</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map",{zoomControl:true}).setView([-11.94,-77.06],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:"&copy; OpenStreetMap"
}).addTo(map);

const icon=L.divIcon({
  className:"",
  html:'<div style="position:relative;width:72px;height:72px;display:grid;place-items:center"><div class="anda-pulse"></div><div class="anda-marker">✝</div></div>',
  iconSize:[72,72],
  iconAnchor:[36,36]
});

let marker=null;
let lastKey="";

function setPending(msg){
  document.getElementById("headerStatus").textContent="GPS pendiente";
  document.getElementById("gpsStatus").textContent="Esperando conexión";
  document.getElementById("message").textContent=msg||"Esperando la conexión segura con el GPS para mostrar la ubicación real.";
  document.getElementById("dot").classList.remove("ok");
  document.getElementById("gpsTime").textContent="";
}

function setLive(d){
  const lat=Number(d.latitude),lng=Number(d.longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return setPending("La fuente GPS aún no entrega coordenadas válidas.");
  const key=lat+","+lng;
  if(!marker){
    marker=L.marker([lat,lng],{icon}).addTo(map).bindPopup("<b>Sagradas Andas</b><br>HSMC · KM 13");
    map.setView([lat,lng],17);
  }else{
    marker.setLatLng([lat,lng]);
    if(key!==lastKey)map.panTo([lat,lng],{animate:true});
  }
  lastKey=key;
  document.getElementById("headerStatus").textContent="GPS conectado";
  document.getElementById("gpsStatus").textContent="Ubicación disponible";
  document.getElementById("message").textContent="Posición GPS mostrada con el marcador propio de las Sagradas Andas.";
  document.getElementById("dot").classList.add("ok");
  document.getElementById("gpsTime").textContent=d.gpstime?("· "+d.gpstime):"";
}

async function loadLocation(){
  try{
   const r=await fetch("https://hsmc-gps.gasparop.workers.dev/?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(d.status==="live")setLive(d);
    else setPending(d.message);
  }catch(e){
    setPending("Aún no está habilitada la fuente segura del GPS.");
  }
}
loadLocation();
setInterval(()=>{if(document.visibilityState==="visible")loadLocation()},30000);
</script>
</body>
</html>
